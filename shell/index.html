<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAgents · step by step</title>
<style>
  :root { --bg:#f6eedd; --card:#fbf6eb; --card2:#e5d6b8; --ink:#241b15; --muted:#65543f; --accent:#c8683e; --accent2:#4f7bc0; --on:#fff8ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1511; --card:#28201a; --card2:#3b3026; --ink:#f4e9d6; --muted:#cdbb9e; --accent:#c4653c; --accent2:#4b75b8; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
         display: grid; grid-template-columns: 320px minmax(0, 1fr); }
  aside { border-right: 3px solid var(--ink); padding: 18px 16px; overflow-y: auto; height: 100vh; position: sticky; top: 0; }
  .brand { background: var(--accent); color: var(--on); border: 3px solid var(--ink); border-radius: 20px;
           box-shadow: 5px 5px 0 var(--ink); padding: 12px 16px; margin-bottom: 18px; }
  .brand b { display: block; font-size: 1.4rem; line-height: 1.1; }
  .brand span { font-size: .85rem; opacity: .95; }
  .label { font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 6px 4px 10px; }
  nav a { display: flex; gap: 10px; align-items: flex-start; text-decoration: none; color: var(--ink); background: var(--card);
          border: 3px solid var(--ink); border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); padding: 10px 12px; margin-bottom: 12px; }
  nav a:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  nav a.active { background: var(--accent); color: var(--on); }
  .num { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; border: 2.5px solid var(--ink);
         background: var(--card2); color: var(--ink); font-weight: 800; }
  nav a.active .num { background: var(--on); color: var(--accent); }
  .t { font-weight: 800; line-height: 1.25; }
  .badge { display: inline-block; font-size: .72rem; font-weight: 800; border: 2px solid var(--ink); border-radius: 999px;
           padding: 0 8px; margin-top: 3px; background: var(--card2); color: var(--ink); }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .info { padding: 16px 22px; border-bottom: 3px solid var(--ink); }
  .info h1 { margin: 0; font-size: 1.4rem; }
  .info p { margin: .3em 0; color: var(--muted); font-weight: 600; }
  .info ul { margin: .4em 0 0; padding-left: 1.2em; font-size: .93rem; }
  .info .next { font-size: .9rem; color: var(--ink); }
  .info .open { font-size: .85rem; font-weight: 800; color: var(--accent2); }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  .empty { padding: 30px; color: var(--muted); }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 3px solid var(--ink); }
    nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    nav a { flex: none; width: 240px; margin: 0; }
    main { height: auto; } iframe { height: 620px; flex: none; }
  }
</style>
</head>
<body>
  <aside>
    <div class="brand"><b>RAgents</b><span>Agents, one step at a time</span></div>
    <div class="label">Projects</div>
    <nav id="nav" aria-label="Projects"></nav>
  </aside>
  <main>
    <section class="info" id="info"><p class="empty">Loading projects…</p></section>
    <iframe id="frame" title="Selected project"></iframe>
  </main>
<script type="module">
  const nav = document.getElementById("nav");
  const info = document.getElementById("info");
  const frame = document.getElementById("frame");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

  let projects = [];
  try {
    projects = await (await fetch("projects.json", { cache: "no-cache" })).json();
  } catch {
    info.replaceChildren(el("p", "empty", "Couldn't load projects.json. Run `npm run build` first."));
  }

  for (const p of projects) {
    const a = el("a"); a.href = "#" + p.folder; a.dataset.folder = p.folder;
    const text = el("div");
    text.append(el("div", "t", p.title));
    if (p.badge) text.append(el("span", "badge", p.badge));
    a.append(el("span", "num", String(p.step)), text);
    nav.append(a);
  }

  function show() {
    const wanted = location.hash.slice(1);
    const p = projects.find((x) => x.folder === wanted) || projects[0];
    if (!p) return;
    for (const a of nav.querySelectorAll("a")) a.classList.toggle("active", a.dataset.folder === p.folder);
    const h = el("h1", "", `Step ${p.step} · ${p.title}`);
    const parts = [h, el("p", "", p.summary)];
    if (p.learn?.length) { const ul = el("ul"); for (const l of p.learn) ul.append(el("li", "", l)); parts.push(ul); }
    if (p.next) parts.push(el("p", "next", "Next: " + p.next));
    const open = el("a", "open", "Open this project on its own ↗"); open.href = p.path; open.target = "_blank"; open.rel = "noopener";
    parts.push(open);
    info.replaceChildren(...parts);
    if (frame.getAttribute("src") !== p.path) frame.src = p.path;
    document.title = `Step ${p.step} · ${p.title} · RAgents`;
  }
  window.addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
