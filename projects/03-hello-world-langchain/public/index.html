<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 3 · Hello World (LangChain)</title>
<!-- Import map: lets agent.js import "@langchain/core/runnables" by name. In the browser that name loads
     LangChain.js from the jsDelivr CDN (version pinned to match package.json); tests use node_modules. -->
<script type="importmap">
{ "imports": { "@langchain/core/runnables": "https://cdn.jsdelivr.net/npm/@langchain/core@1.2.17/runnables/+esm" } }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header>
      <div>Hello World Agent <small>Step 3 · the step 1 rules, as a LangChain chain.</small></div>
      <span id="status">loading LangChain…</span>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="msg" autocomplete="off" placeholder="Say Hello…" aria-label="Your message" autofocus>
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </main>

<script type="module">
  // Page wiring for step 3: load the chain, then run each message through it.
  import { showDiagram } from "./extras/diagram.js";   // EXTRA: the "what happens" diagram (not part of the agent)
  import "./extras/langsmith-todo.js";                 // EXTRA: the LangSmith to-do card

  const log = document.getElementById("log");        // the scrolling message list
  const input = document.getElementById("msg");      // the text box
  const send = document.getElementById("send");      // enabled once LangChain has loaded
  const status = document.getElementById("status");  // header badge

  /** Appends one chat bubble. `who` is "you" (right, blue) or "bot" (left, orange). */
  function add(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;            // textContent, never innerHTML
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  // Load the agent (and LangChain from the CDN). If the CDN is blocked, say so instead of failing silently.
  let chain;
  try {
    ({ chain } = await import("./agent.js"));
    status.textContent = "LangChain ready"; status.className = "ok";
    send.disabled = false;
  } catch (err) {
    status.textContent = "error"; status.className = "warn";
    add("Couldn't load LangChain from the CDN: " + (err?.message || err), "bot");
  }

  /** Runs when you press Send or Enter (the form's "submit" event). */
  async function onSend(e) {
    e.preventDefault();                // stay on the page instead of submitting the form
    if (!chain) return;
    const text = input.value;
    if (text.trim()) add(text, "you");
    input.value = "";
    const result = await chain.invoke(text);   // ← the call into agent.js's chain: returns { reply, rule }
    add(result.reply, "bot");                  // ← the reply goes back onto the page
    input.focus();
    showDiagram(text, chain);                  // EXTRA: replay this message in the diagram
  }
  document.getElementById("form").addEventListener("submit", onSend);
</script>
</body>
</html>
