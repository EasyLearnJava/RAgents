<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 1 · Hello World (rules)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header>Hello World Agent <small>Step 1 · rules only. Say "Hello" and it says "Hello World".</small></header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="msg" autocomplete="off" placeholder="Say Hello…" aria-label="Your message" autofocus>
      <button type="submit">Send</button>
    </form>
  </main>
<script type="module">
  // Page wiring for step 1: read the input, ask the agent (agent.js), show both messages.
  import { respond } from "./agent.js";
  import { showDiagram } from "./extras/diagram.js";   // EXTRA: the "what happens" diagram (not part of the agent)
  import { showStreet } from "./extras/street.js";     // EXTRA: the same trip as a street scene with a truck

  const log = document.getElementById("log");      // the scrolling message list
  const input = document.getElementById("msg");    // the text box

  /** Appends one chat bubble. `who` is "you" (right, blue) or "bot" (left, orange). */
  function add(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;            // textContent, never innerHTML: input is never run as HTML
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  /** Runs when you press Send or Enter (the form's "submit" event). */
  function onSend(e) {
    e.preventDefault();                // stay on the page instead of submitting the form
    const text = input.value;
    if (text.trim()) add(text, "you");
    const reply = respond(text);       // ← the call into agent.js
    add(reply, "bot");                 // ← the reply goes back onto the page
    input.value = "";
    input.focus();
    showDiagram(text, reply);          // EXTRA: replay this message in the diagram
    showStreet(text, reply);           // EXTRA: and as a truck trip in the street view
  }
  document.getElementById("form").addEventListener("submit", onSend);
</script>
</body>
</html>
