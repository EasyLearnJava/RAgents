<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 4 · Hello World (Python backend)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header>
      <div>Hello World Agent <small>Step 4 · the LangChain chain, in Python, on a server.</small></div>
      <span id="status">checking backend…</span>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <!-- 1100 on purpose: the server accepts up to 1000 (MAX_CHARS in main.py), so you can watch it reject a longer message. -->
      <input id="msg" autocomplete="off" placeholder="Say Hello…" aria-label="Your message" maxlength="1100" autofocus>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
<script type="module">
  // Page wiring for step 4: send each message to the Python backend (/api/step4/chat) and show the reply.
  import { showDiagram } from "./extras/diagram.js";   // EXTRA: the "what happens" diagram (not part of the agent)

  const log = document.getElementById("log");        // the scrolling message list
  const input = document.getElementById("msg");      // the text box
  const send = document.getElementById("send");      // disabled while a reply is on its way
  const status = document.getElementById("status");  // header badge: backend ready / not running

  /** Appends one chat bubble and returns it (so "thinking…" can be removed). `who` is "you" or "bot". */
  function add(text, who, extra = "") {
    const div = document.createElement("div");
    div.className = `msg ${who} ${extra}`.trim();
    div.textContent = text;            // textContent, never innerHTML
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  /** Calls the backend; returns {ok, status, data} and never throws (network errors become ok: false). */
  async function api(path, body) {
    try {
      const res = await fetch(path, body === undefined ? {} :
        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = (res.headers.get("content-type") || "").includes("json") ? await res.json() : null;
      return { ok: res.ok && data !== null, status: res.status, data };
    } catch (err) {
      return { ok: false, status: 0, data: { error: String(err?.message || err) } };
    }
  }

  /** Why the backend couldn't answer, in words, from the HTTP status. */
  function whyFailed({ status, data }) {
    if (status === 422) return "The server rejected it: messages can be at most 1000 characters.";
    if (status === 502) return data?.error || "The Python backend isn't running on this machine (see step 4's README).";
    if (status === 404 || data === null) return "The Python backend isn't deployed on this site yet. Run step 4 locally (see its README).";
    if (status === 0) return "Couldn't reach the server. Check your connection.";
    return `The server returned an error (${status}).`;
  }

  // On load: is the backend there? Show its versions, or why it isn't.
  const health = await api("/api/step4/health");
  if (health.ok) {
    status.textContent = `Python ${health.data.python} · langchain-core ${health.data.langchain_core}`;
    status.className = "ok";
  } else {
    status.textContent = "backend not available"; status.className = "warn";
    add(whyFailed(health), "bot");
  }

  /** Runs when you press Send or Enter (the form's "submit" event). */
  async function onSend(e) {
    e.preventDefault();                // stay on the page instead of submitting the form
    const text = input.value;
    if (text.trim()) add(text, "you");
    input.value = "";
    send.disabled = true;
    const thinking = add("thinking…", "bot", "thinking");
    const t0 = performance.now();
    const res = await api("/api/step4/chat", { message: text });   // ← the call to the Python server
    const totalMs = performance.now() - t0;
    thinking.remove();
    const shown = res.ok ? res.data.reply : whyFailed(res);
    add(shown, "bot");                                             // ← the reply goes back onto the page
    send.disabled = false;
    input.focus();
    showDiagram(text, res, totalMs, shown);                        // EXTRA: replay the round trip in the diagram
  }
  document.getElementById("form").addEventListener("submit", onSend);
</script>
</body>
</html>
