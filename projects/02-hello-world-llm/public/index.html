<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 2 · Hello World (real model)</title>
<style>
  :root { --bg:#f6eedd; --card:#fbf6eb; --ink:#241b15; --muted:#65543f; --you:#4f7bc0; --bot:#c8683e; --ok:#5c8d55; --warn:#b14d44; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1511; --card:#28201a; --ink:#f4e9d6; --muted:#cdbb9e; --you:#4b75b8; --bot:#c4653c; --ok:#578a50; --warn:#a9493f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  .chat { width: 100%; max-width: 520px; background: var(--card); border: 3px solid var(--ink);
          border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); overflow: hidden; }
  header { padding: 14px 18px; border-bottom: 3px solid var(--ink); font-weight: 800; font-size: 1.1rem;
           display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  header small { display: block; font-weight: 500; font-size: .85rem; color: var(--muted); }
  #status { font-size: .78rem; font-weight: 800; color: #fff8ec; background: var(--muted); border: 2px solid var(--ink);
            border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
  #status.ok { background: var(--ok); } #status.warn { background: var(--warn); }
  #log { height: 340px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 8px 14px; border: 2.5px solid var(--ink); border-radius: 16px; color: #fff8ec; white-space: pre-wrap; }
  .you { align-self: flex-end; background: var(--you); }
  .bot { align-self: flex-start; background: var(--bot); }
  .thinking { opacity: .7; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 3px solid var(--ink); }
  input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent;
          border: 2.5px solid var(--ink); border-radius: 999px; padding: 8px 14px; }
  button { font: inherit; font-weight: 800; border: 2.5px solid var(--ink); border-radius: 12px;
           background: var(--bot); color: #fff8ec; padding: 8px 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
  <main class="chat">
    <header>
      <div>Hello World Agent <small>Step 2 · your message goes to a real model.</small></div>
      <span id="status">connecting…</span>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="msg" autocomplete="off" placeholder="Say Hello, or ask anything…" aria-label="Your message" maxlength="500" autofocus>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
<script type="module">
  import { startAgent } from "./main.js";
  const log = document.getElementById("log");
  const input = document.getElementById("msg");
  const send = document.getElementById("send");
  const status = document.getElementById("status");

  function add(text, who, extra = "") {
    const div = document.createElement("div");
    div.className = `msg ${who} ${extra}`.trim();
    div.textContent = text;            // textContent: model output is never run as HTML
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  let agent;
  try {
    agent = await startAgent();
    status.textContent = agent.ready ? agent.model : "setup needed";
    status.className = agent.ready ? "ok" : "warn";
    if (!agent.ready) add(await agent.respond(""), "bot");
  } catch (err) {
    status.textContent = "error"; status.className = "warn";
    add("Couldn't start the agent: " + (err?.message || err), "bot");
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!agent) return;
    const text = input.value;
    if (text.trim()) add(text, "you");
    input.value = "";
    send.disabled = true;
    const thinking = add("thinking…", "bot", "thinking");
    const reply = await agent.respond(text);
    thinking.remove();
    add(reply, "bot");
    send.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
