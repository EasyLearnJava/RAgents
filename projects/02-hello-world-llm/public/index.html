<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 2 · Hello World (real model)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header>
      <div>Hello World Agent <small>Step 2 · your message goes to a real model.</small></div>
      <span id="status">connecting…</span>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <!-- 550 on purpose: agent.js accepts up to 500 (MAX_CHARS), so you can watch its check reject a longer message. -->
      <input id="msg" autocomplete="off" placeholder="Say Hello, or ask anything…" aria-label="Your message" maxlength="550" autofocus>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
<script type="module">
  // Page wiring for step 2: connect once (startAgent), then send each message to the model.
  import { startAgent } from "./main.js";
  import { diagram } from "./extras/diagram.js";   // EXTRA: the "what happens" diagram (not part of the agent)

  const log = document.getElementById("log");        // the scrolling message list
  const input = document.getElementById("msg");      // the text box
  const send = document.getElementById("send");      // disabled while a reply is on its way
  const status = document.getElementById("status");  // header badge: model name, or "setup needed"

  /** Appends one chat bubble and returns it (so "thinking…" can be removed). `who` is "you" or "bot". */
  function add(text, who, extra = "") {
    const div = document.createElement("div");
    div.className = `msg ${who} ${extra}`.trim();
    div.textContent = text;            // textContent: model output is never run as HTML
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // Connect once when the page loads. If setup is incomplete, show what's missing in the chat.
  let agent;
  try {
    agent = await startAgent(diagram.event);   // diagram.event is EXTRA: startAgent() works without it
    status.textContent = agent.ready ? agent.model : "setup needed";
    status.className = agent.ready ? "ok" : "warn";
    if (!agent.ready) {
      const problem = await agent.respond("");
      add(problem, "bot");
      diagram.setupProblem(problem);           // EXTRA
    }
  } catch (err) {
    status.textContent = "error"; status.className = "warn";
    add("Couldn't start the agent: " + (err?.message || err), "bot");
  }

  /** Runs when you press Send or Enter (the form's "submit" event). */
  async function onSend(e) {
    e.preventDefault();                // stay on the page instead of submitting the form
    if (!agent) return;
    const text = input.value;
    if (text.trim()) add(text, "you");
    input.value = "";
    send.disabled = true;
    diagram.start(text, agent.ready);          // EXTRA
    const thinking = add("thinking…", "bot", "thinking");
    const reply = await agent.respond(text);   // ← the call into agent.js (which calls generate() in main.js)
    thinking.remove();
    add(reply, "bot");                         // ← the reply goes back onto the page
    send.disabled = false;
    input.focus();
    diagram.reply(reply);                      // EXTRA: replay the way back
  }
  document.getElementById("form").addEventListener("submit", onSend);
</script>
</body>
</html>
