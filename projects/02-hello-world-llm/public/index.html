<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 2 · Hello World (real model)</title>
<style>
  :root { --bg:#f6eedd; --card:#fbf6eb; --ink:#241b15; --muted:#65543f; --you:#4f7bc0; --bot:#c8683e; --ok:#5c8d55; --warn:#b14d44; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1511; --card:#28201a; --ink:#f4e9d6; --muted:#cdbb9e; --you:#4b75b8; --bot:#c4653c; --ok:#578a50; --warn:#a9493f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 16px;
         background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  .chat { width: 100%; max-width: 520px; background: var(--card); border: 3px solid var(--ink);
          border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); overflow: hidden; }
  header { padding: 14px 18px; border-bottom: 3px solid var(--ink); font-weight: 800; font-size: 1.1rem;
           display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  header small { display: block; font-weight: 500; font-size: .85rem; color: var(--muted); }
  #status { font-size: .78rem; font-weight: 800; color: #fff8ec; background: var(--muted); border: 2px solid var(--ink);
            border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
  #status.ok { background: var(--ok); } #status.warn { background: var(--warn); }
  #log { height: 340px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 8px 14px; border: 2.5px solid var(--ink); border-radius: 16px; color: #fff8ec; white-space: pre-wrap; }
  .you { align-self: flex-end; background: var(--you); }
  .bot { align-self: flex-start; background: var(--bot); }
  .thinking { opacity: .7; font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 3px solid var(--ink); }
  input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent;
          border: 2.5px solid var(--ink); border-radius: 999px; padding: 8px 14px; }
  button { font: inherit; font-weight: 800; border: 2.5px solid var(--ink); border-radius: 12px;
           background: var(--bot); color: #fff8ec; padding: 8px 16px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
  <main class="chat">
    <header>
      <div>Hello World Agent <small>Step 2 · your message goes to a real model.</small></div>
      <span id="status">connecting…</span>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="msg" autocomplete="off" placeholder="Say Hello, or ask anything…" aria-label="Your message" maxlength="500" autofocus>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <div id="flow" style="width:100%"></div>
<script type="module">
  // Page wiring for step 2: connect once (startAgent), then send each message to the model.
  // Events from agent.js drive the "what happens" diagram under the chat.
  import { startAgent } from "./main.js";
  import { MODEL } from "./ai-config.js";
  import { createFlow } from "/lib/flow.js";

  const flow = createFlow(document.getElementById("flow"), {
    title: "What happens when you press Send",
    hint: "Your message leaves the browser for the first time. App Check, AI Logic and Gemini happen in one request: " +
          "they light up in order while you wait, then each shows its real result. The way back is drawn underneath, " +
          "slowed down slightly so you can follow it.",
    lanes: [
      { label: "You", nodes: [{ id: "you", title: "You", sub: "type a message, press Send" }] },
      { label: "Your browser · your code", nodes: [
        { id: "agent", title: "agent.js", sub: "not empty? ≤ 500 characters?" },
        { id: "appcheck", title: "App Check", sub: "reCAPTCHA scores the visitor → single-use token" },
      ] },
      { label: "Google Cloud", nodes: [
        { id: "ailogic", title: "Firebase AI Logic", sub: "checks the token, adds the Gemini key" },
        { id: "gemini", title: `Gemini · ${MODEL}`, sub: "system instruction + your one message" },
      ] },
    ],
    response: [
      { label: "Google Cloud", nodes: [
        { id: "r-gemini", title: "Gemini", sub: "writes the reply (or returns an error)" },
        { id: "r-ailogic", title: "Firebase AI Logic", sub: "sends the result back to your browser" },
      ] },
      { label: "Your browser · your code", nodes: [
        { id: "r-sdk", title: "Firebase SDK", sub: "response.text() pulls out the reply" },
        { id: "r-agent", title: "agent.js", sub: "trims it · errors → friendly message" },
        { id: "r-page", title: "index.html", sub: "removes “thinking…”, adds the bubble" },
      ] },
      { label: "You", nodes: [{ id: "r-you", title: "You", sub: "read the reply" }] },
    ],
  });

  // While the single request is in flight, light the boxes in order (the SDK doesn't report the phases).
  let timers = [];
  const stopTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const REQUEST = ["appcheck", "ailogic", "gemini"];
  const ERRORS = {
    appcheck: { at: ["appcheck", "ailogic"], note: "rejected (403)", why: "AI Logic refused the request: App Check token missing or invalid" },
    network: { at: ["ailogic"], note: "not reached", why: "the request never reached Google (network/offline)" },
    quota: { at: ["gemini"], note: "quota used up (429)", why: "Gemini's free-tier limit was reached" },
    busy: { at: ["gemini"], note: "busy (500/503)", why: "Gemini is overloaded right now" },
    other: { at: ["gemini"], note: "error", why: "the model call failed" },
  };
  let outcome = null;          // what happened on the way there; decides how the way back is drawn

  /** Request row: turns each agent.js event into box states and trace lines. */
  function onEvent(e) {
    outcome = e;
    if (e.type === "rejected") {
      const why = e.reason === "empty" ? "nothing typed" : "longer than 500 characters";
      flow.set("agent", "error", why);
      REQUEST.forEach((id) => flow.set(id, "skip"));
      flow.log(`agent.js stopped it: ${why}. No request was sent (no quota used).`, "error");
    } else if (e.type === "accepted") {
      flow.set("agent", "done", `${e.chars} characters, OK`);
      flow.log(`agent.js: input OK (${e.chars} characters)`);
    } else if (e.type === "model-start") {
      flow.set("appcheck", "active");
      flow.log("Firebase SDK: getting a single-use App Check token and sending the request…");
      timers.push(setTimeout(() => flow.set("ailogic", "active"), 250));
      timers.push(setTimeout(() => flow.set("gemini", "active"), 500));
    } else if (e.type === "model-ok" || e.type === "model-empty") {
      stopTimers();
      flow.set("appcheck", "done", "token accepted");
      flow.set("ailogic", "done", "key added, forwarded");
      flow.set("gemini", "done", `answered in ${e.ms} ms`);
      flow.log(`Request reached Gemini; it answered in ${e.ms} ms. It saw only the system instruction and this one message (no history yet).`);
    } else if (e.type === "model-error") {
      stopTimers();
      const err = ERRORS[e.kind] || ERRORS.other;
      for (const id of REQUEST) {
        if (err.at.includes(id)) flow.set(id, "error", err.note);
        else if (REQUEST.indexOf(id) < REQUEST.indexOf(err.at[0])) flow.set(id, "done");
        else flow.set(id, "skip");
      }
      flow.log(`Failed after ${e.ms} ms: ${err.why}.`, "error");
    }
  }

  const pause = (ms) => new Promise((r) => setTimeout(r, ms));
  let run = 0;                 // a newer message cancels an older animation

  /**
   * Response row: replays the way back, one box at a time, from what actually happened (`outcome`).
   * Errors travel back too: Google returns an error status and agent.js turns it into a friendly message.
   */
  async function animateResponse(reply, id) {
    const o = outcome || {};
    const short = `“${reply.slice(0, 40)}${reply.length > 40 ? "…" : ""}”`;
    const err = o.type === "model-error" ? (ERRORS[o.kind] || ERRORS.other) : null;
    const code = { appcheck: "403", quota: "429", busy: "500/503" }[o.kind] || "error";
    // [box, state, note, trace line] for each hop on the way back, in order.
    let steps;
    if (o.type === "rejected") {
      steps = [["r-gemini", "skip"], ["r-ailogic", "skip"], ["r-sdk", "skip"],
        ["r-agent", "done", "returned a hint", "agent.js returned a hint straight away (nothing was sent)"]];
    } else if (o.type === "model-ok") {
      steps = [["r-gemini", "done", `${o.chars} characters`, `Gemini wrote a ${o.chars}-character reply`],
        ["r-ailogic", "done", "200 OK", "Firebase AI Logic sent it back to the browser"],
        ["r-sdk", "done", "text extracted", "Firebase SDK: response.text() pulled out the reply text"],
        ["r-agent", "done", "trimmed, not empty", "agent.js trimmed it and checked it isn't empty"]];
    } else if (o.type === "model-empty") {
      steps = [["r-gemini", "error", "empty reply", "Gemini returned an empty reply"],
        ["r-ailogic", "done", "200 OK", "Firebase AI Logic sent it back"],
        ["r-sdk", "done", "empty text", "Firebase SDK: the text was empty"],
        ["r-agent", "done", "→ “try again” message", "agent.js replaced it with a “please try again” message"]];
    } else if (err && o.kind === "network") {
      steps = [["r-gemini", "skip"], ["r-ailogic", "skip"],
        ["r-sdk", "error", "network error", "Firebase SDK threw a network error (nothing came back)"],
        ["r-agent", "done", "→ friendly message", "agent.js turned the error into a friendly message"]];
    } else if (err) {
      steps = [
        o.kind === "appcheck" ? ["r-gemini", "skip"] : ["r-gemini", "error", err.note, `Gemini returned an error: ${err.note}`],
        ["r-ailogic", "error", `${code} sent back`, `Firebase AI Logic sent back an error (${code})`],
        ["r-sdk", "error", "threw an error", "Firebase SDK threw it as an error"],
        ["r-agent", "done", "→ friendly message", "agent.js caught it and turned it into a friendly message"]];
    } else {                   // setup incomplete: the agent answered with the setup message, nothing was sent
      steps = [["r-gemini", "skip"], ["r-ailogic", "skip"], ["r-sdk", "skip"],
        ["r-agent", "done", "returned the setup message", "agent.js returned the setup message (nothing was sent)"]];
    }
    steps.push(["r-page", "done", "bubble added", "index.html removed “thinking…” and added the reply bubble"]);
    steps.push(["r-you", "done", short, `You see: ${short}`]);
    for (const [box, state, note, line] of steps) {
      if (state === "skip") { flow.set(box, "skip"); continue; }
      flow.set(box, "active"); await pause(220); if (id !== run) return;
      flow.set(box, state, note);
      if (line) flow.log(line, box === "r-you" ? "done" : state === "error" ? "error" : undefined);
    }
  }
  const log = document.getElementById("log");        // the scrolling message list
  const input = document.getElementById("msg");      // the text box
  const send = document.getElementById("send");      // disabled while a reply is on its way
  const status = document.getElementById("status");  // header badge: model name, or "setup needed"

  /**
   * Appends one chat bubble and returns it (so the "thinking…" bubble can be removed later).
   * `who` is "you" or "bot"; `extra` adds CSS classes such as "thinking".
   */
  function add(text, who, extra = "") {
    const div = document.createElement("div");
    div.className = `msg ${who} ${extra}`.trim();
    div.textContent = text;            // textContent: model output is never run as HTML
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // Connect once when the page loads. If setup is incomplete, show what's missing in the chat.
  let agent;
  try {
    agent = await startAgent(onEvent);
    status.textContent = agent.ready ? agent.model : "setup needed";
    status.className = agent.ready ? "ok" : "warn";
    if (!agent.ready) {
      const problem = await agent.respond("");
      add(problem, "bot");
      flow.set("appcheck", "error", "setup needed");
      flow.log(problem, "error");
    }
  } catch (err) {
    status.textContent = "error"; status.className = "warn";
    add("Couldn't start the agent: " + (err?.message || err), "bot");
  }

  // Send: show the message, block double-sends, show "thinking…" until the model replies.
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();                // stay on the page instead of submitting the form
    if (!agent) return;
    const text = input.value;
    if (text.trim()) add(text, "you");
    stopTimers();
    const id = ++run;
    outcome = null;
    flow.start();
    flow.set("you", "done", text.trim() ? `“${text.trim().slice(0, 30)}”` : "(empty)");
    flow.log(`You typed “${text.trim()}”`);
    if (!agent.ready) {
      flow.set("agent", "error", "setup needed");
      REQUEST.forEach((box) => flow.set(box, "skip"));
      flow.log("Setup isn't finished, so no request was sent.", "error");
    }
    input.value = "";
    send.disabled = true;
    const thinking = add("thinking…", "bot", "thinking");
    const reply = await agent.respond(text);
    thinking.remove();
    add(reply, "bot");
    send.disabled = false;
    input.focus();
    animateResponse(reply, id);
  });
</script>
</body>
</html>
